<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Koonkla — Product Builder</title>
<desc id="desc">A dark, gradient banner for a Thai digital product builder.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080d1b"/>
    <stop offset="0.55" stop-color="#11172b"/>
    <stop offset="1" stop-color="#071d26"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#65e6ca"/>
    <stop offset="1" stop-color="#9e87ff"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#7c69ff" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7c69ff" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="320" rx="28" fill="url(#bg)"/>
<circle cx="1000" cy="150" r="280" fill="url(#orb)"/>
<path d="M790 260C900 205 935 82 1072 65s166 69 194 110" fill="none" stroke="url(#glow)" stroke-opacity=".38" stroke-width="2"/>

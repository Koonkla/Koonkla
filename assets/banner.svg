<text x="72" y="168" fill="#f4f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Koonkla</text>
<text x="77" y="215" fill="#bbc4d8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Building useful digital products, one idea at a time.</text>
<text x="78" y="274" fill="#8793aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.5">WEB APPS  ·  AI WORKFLOWS  ·  TRAVEL TECH  ·  INTERACTIVE 3D</text>

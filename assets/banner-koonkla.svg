<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">koonkla</title>
<desc id="desc">Animated monochrome banner for koonkla with a rotating orbit and scanning light.</desc>
<style>
@keyframes breathe{0%,100%{opacity:.22;transform:scale(.96)}50%{opacity:.56;transform:scale(1.06)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.32}50%{transform:translateY(-11px);opacity:.88}}
@keyframes scan{0%{transform:translateY(-30px);opacity:0}15%,82%{opacity:.18}100%{transform:translateY(390px);opacity:0}}
.aura{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}
.star1{animation:drift 3.6s ease-in-out infinite}
.star2{animation:drift 4.2s ease-in-out -1.4s infinite}
.star3{animation:drift 3.1s ease-in-out -2.1s infinite}
.scan{animation:scan 7s linear infinite}
@media(prefers-reduced-motion:reduce){.aura,.orbit,.star1,.star2,.star3,.scan{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset=".55" stop-color="#171717"/><stop offset="1" stop-color="#050505"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".52" stop-color="#a1a1aa"/><stop offset="1" stop-color="#f4f4f5"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1200" height="360" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
<circle class="aura" cx="960" cy="175" r="260" fill="url(#glow)"/>
<g class="orbit"><ellipse cx="980" cy="166" rx="244" ry="88" fill="none" stroke="url(#silver)" stroke-opacity=".34" stroke-width="1.4"/><circle cx="1197" cy="166" r="5" fill="#fff"/></g>
<ellipse cx="980" cy="166" rx="174" ry="62" fill="none" stroke="#fff" stroke-opacity=".16"/>
<path d="M770 298C865 246 913 84 1054 70s177 52 233 108" fill="none" stroke="url(#silver)" stroke-opacity=".54" stroke-width="2"/>
<circle class="star1" cx="1020" cy="94" r="4" fill="#fff"/><circle class="star2" cx="1104" cy="230" r="3" fill="#d4d4d8"/><circle class="star3" cx="902" cy="260" r="2.5" fill="#fff"/><circle class="star1" cx="1144" cy="118" r="2" fill="#a1a1aa"/>
<rect class="scan" width="1200" height="2" fill="#fff"/>
<text x="76" y="86" fill="#a1a1aa" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">WEB · AI · TOOLS</text>
<text x="72" y="180" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">koonkla</text>
<text x="77" y="226" fill="#d4d4d8" font-family="Segoe UI,Arial,sans-serif" font-size="21">Digital products made with curiosity and care.</text>
<text x="78" y="292" fill="#a1a1aa" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.6">WEB APPS · AI WORKFLOWS · BOTS &amp; TOOLS</text>
<path d="M78 315h142" stroke="#fff" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
</g></svg>